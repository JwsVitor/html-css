<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela 06</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table{
        border-collapse: collapse;
        width: 400px;
        height: 400px;
        }
        th{
        border: 1px solid black;
        padding: 5px;
        font-size: 0.9em;
        background-color: grey;
        color: white;
        }
        th.cabeca{
            background-color: white;
            color: black;
        }
        th.mediah{
            text-align: justify;
        }
        td{
        border: 1px solid black;
        padding: 5px;
        font-size: 0.9em;
        }
        td.media{
            background-color: grey;
            color: white;
        }
    </style>
</head>
<body>
    <table>
        <tbody>
            <tr>
                <th rowspan="2" scope="row">Área</th>
                <th rowspan="2" scope="row">Disciplinas</th>
                <th colspan="2">Notas</th>
                <th rowspan="2" scope="row">Média</th>
            </tr>
            <tr>
                <th>Nota 1</th>
                <th>Nota 2</th>
            </tr>
        <tr>
            <th class="cabeca" rowspan="4">Exatas</th>
            <td>Matemática</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Física</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>    
        </tr>
        <tr>
            <td>Química</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Biologia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>

        <tr>
            <th colspan="4" scope="col" class="mediah">Média de Exatas</th>
            <td class="media">0.0</td>
        </tr>
        <tr>
            <th class="cabeca" rowspan="2">Humanas</th>
            <td>História</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <td>Geografia</td>
            <td>0.0</td>
            <td>0.0</td>
            <td>0.0</td>
        </tr>
        <tr>
            <th colspan="4" scope="col" class="mediah">Média de Humanas</th>
            <td class="media">0.0</td>
        </tr>
        </tbody>
    </table>
</body>
</html>
